<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For K ❤️</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;500&family=Great+Vibes&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      overflow: hidden;
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    #root {
      width: 100vw;
      height: 100vh;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-10px); }
      75% { transform: translateX(10px); }
    }

    @keyframes glowPulse {
      0%, 100% { 
        box-shadow: 0 0 20px rgba(196, 69, 105, 0.35),
                    0 0 40px rgba(196, 69, 105, 0.2);
      }
      50% { 
        box-shadow: 0 0 30px rgba(196, 69, 105, 0.5),
                    0 0 60px rgba(196, 69, 105, 0.3);
      }
    }

    @keyframes breathe {
      0%, 100% {
        background-position: 0% 50%;
      }
      50% {
        background-position: 100% 50%;
      }
    }

    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: #14141B;
    }

    ::-webkit-scrollbar-thumb {
      background: #8B1E3F;
      border-radius: 3px;
    }

    button:hover {
      background: #C44569 !important;
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(196, 69, 105, 0.4);
    }

    .envelope:hover {
      background: #C44569 !important;
      transform: translateX(5px);
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const ValentineStory = () => {
      const [currentPage, setCurrentPage] = useState(0);
      const [inputValue, setInputValue] = useState('');
      const [showInput, setShowInput] = useState(false);
      const [showError, setShowError] = useState(false);
      const [thinking, setThinking] = useState(false);
      const [progressTimer, setProgressTimer] = useState(0);
      const [visibleCards, setVisibleCards] = useState(0);
      const [visibleLines, setVisibleLines] = useState(0);
      const [canAdvance, setCanAdvance] = useState(false);
      const [visibleEnvelopes, setVisibleEnvelopes] = useState([]);
      const [showGoodGirl, setShowGoodGirl] = useState(false);
      const audioRef = useRef(null);
      const heartbeatRef = useRef(null);

      // Load progress from localStorage
      useEffect(() => {
        const savedPage = localStorage.getItem('valentine-progress');
        if (savedPage) {
          setCurrentPage(parseInt(savedPage, 10));
        }
      }, []);

      // Save progress to localStorage
      useEffect(() => {
        localStorage.setItem('valentine-progress', currentPage.toString());
      }, [currentPage]);

      // Initialize audio
      useEffect(() => {
        if (audioRef.current && currentPage >= 1) {
          audioRef.current.volume = 0.30;
          const playPromise = audioRef.current.play();
          if (playPromise !== undefined) {
            playPromise.catch(e => {
              console.log('Audio autoplay blocked - will play on first interaction');
              document.addEventListener('click', () => {
                audioRef.current.play();
              }, { once: true });
            });
          }
        }
      }, [currentPage]);

      // Gradually increase volume to Page 7
      useEffect(() => {
        if (audioRef.current && currentPage >= 1 && currentPage <= 7) {
          const targetVolume = 0.30 + ((currentPage - 1) / 6) * 0.15;
          audioRef.current.volume = Math.min(targetVolume, 0.45);
        }
      }, [currentPage]);

      // Page 1: Entry ritual timing
      useEffect(() => {
        if (currentPage === 0) {
          setTimeout(() => setCanAdvance(true), 800);
        }
      }, [currentPage]);

      // Page 2: Progress bar
      useEffect(() => {
        if (currentPage === 2) {
          setProgressTimer(0);
          setCanAdvance(false);
          const interval = setInterval(() => {
            setProgressTimer(prev => {
              if (prev >= 100) {
                clearInterval(interval);
                setCanAdvance(true);
                return 100;
              }
              return prev + 1;
            });
          }, 100);
          return () => clearInterval(interval);
        }
      }, [currentPage]);

      // Page 3: Card reveals
      useEffect(() => {
        if (currentPage === 3) {
          setVisibleCards(0);
          setCanAdvance(true);
        }
      }, [currentPage]);

      // Page 4: Line reveals and heartbeat
      useEffect(() => {
        if (currentPage === 4) {
          setVisibleLines(0);
          setCanAdvance(false);
          if (heartbeatRef.current) {
            heartbeatRef.current.volume = 0.2;
            heartbeatRef.current.play().catch(e => console.log('Heartbeat playback delayed'));
          }
          setTimeout(() => setVisibleLines(1), 300);
          setTimeout(() => setVisibleLines(2), 1200);
          setTimeout(() => setVisibleLines(3), 2100);
          setTimeout(() => setCanAdvance(true), 2500);
        }
      }, [currentPage]);

      // Page 5: Timed reading
      useEffect(() => {
        if (currentPage === 5) {
          setVisibleLines(0);
          setCanAdvance(false);
          setTimeout(() => setVisibleLines(1), 500);
          setTimeout(() => setVisibleLines(2), 5500);
          setTimeout(() => setVisibleLines(3), 9500);
          setTimeout(() => setVisibleLines(4), 10500);
          setTimeout(() => setCanAdvance(true), 11000);
        }
      }, [currentPage]);

      // Page 6: Envelope reveals
      useEffect(() => {
        if (currentPage === 6) {
          setVisibleEnvelopes([]);
          setShowGoodGirl(false);
          setCanAdvance(true);
        }
      }, [currentPage]);

      const handlePasswordSubmit = () => {
        const correctAnswers = ['rishi', 'flash', 'flash133566'];
        if (correctAnswers.includes(inputValue.toLowerCase().trim())) {
          setThinking(true);
          setTimeout(() => {
            setCurrentPage(1);
            setThinking(false);
            setShowInput(false);
          }, 3000);
        } else {
          setShowError(true);
          setTimeout(() => setShowError(false), 1000);
        }
      };

      const handleCardTap = () => {
        if (visibleCards < 10) {
          setVisibleCards(prev => prev + 1);
        }
      };

      const toggleEnvelope = (index) => {
        if (visibleEnvelopes.includes(index)) {
          setVisibleEnvelopes(prev => prev.filter(i => i !== index));
        } else {
          setVisibleEnvelopes(prev => [...prev, index]);
          if (visibleEnvelopes.length === 2 && !visibleEnvelopes.includes(index)) {
            setTimeout(() => setShowGoodGirl(true), 500);
          }
        }
      };

      const cards = [
        "Your soft, adorable voice… it lingers even after you stop speaking",
        "The way your body quietly reacts when I guide you 🙇‍♀️",
        "Your sweetness in obeying even the smallest requests 😚",
        "You feel like a breath of fresh air in a noisy world 🍃",
        "You make me laugh 😂",
        "The warmth and softness of Your boobies 😋... impossible to ignore 🤍",
        "Your constant need for closeness and cuddles 🫂💗",
        "Your first asshole fuck story 😅",
        "How easy it is to talk to you… I could stay there forever ✨",
        "Your surrender… every \"yes, sir\" carries trust, and I feel it 🖤"
      ];

      const envelopeContents = [
        "You spend so much time holding yourself together.\nChoosing the right words… reacting the right way… pretending you're more composed than you really feel.\nYou don't need that here.\nHere you can slow down, breathe, and let me hold the moment for you.\nI'm not going anywhere.",
        "Look at you… following every line properly.\nSuch a well behaved girl.\nMakes me wonder how long that innocence lasts when I start pushing a little more.",
        "Imagine this, my obedient submissive slut. You've been waiting just as I commanded, on your hands and knees in the entryway of your home, heart pounding with anticipation. The door clicks open, and there you are, my sweet girl, positioned perfectly for your Master. Your eyes lift slowly to meet mine, locking in that intense gaze for a lingering moment, full of devotion and desire. Then, as a good sub should, you lower them submissively, casting your lashes down to the floor, exposing the curve of your neck like an offering.\n\nMy very first words are \"Look at you, my little slut, so eager and ready for Master\" and then........."
      ];

          animation: 'breathe 8s ease-in-out infinite',
          color: '#E8E6EA',
          display: 'flex',
          alignItems: 'center',

        },
        error: {

          marginTop: '1rem',
          fontSize: '1rem',
        },
        thinkingContainer: {
          marginTop: '2rem',
          opacity: 0.4,
        },
        thinking: {
          fontSize: '1.2rem',
          color: '#9A98A3',
          fontStyle: 'italic',
          marginBottom: '1rem',
        },
        progressBar: {

        },

        },
        cardsContainer: {

        },
        card: {

          borderRadius: '8px',
          fontSize: '1.2rem',

          color: '#E8E6EA',

        },
        envelopesContainer: {

        },
        envelopeWrapper: {

          borderRadius: '8px',

          cursor: 'pointer',
          fontFamily: "'Inter', sans-serif",
          display: 'flex',
          alignItems: 'center',
          justifyContent: 'space-between',
          transition: 'all 0.3s ease',
        },
        envelopeContent: {
          padding: '2rem',
          background: 'rgba(20, 20, 27, 0.9)',
          border: '1px solid rgba(139, 30, 63, 0.3)',
          borderRadius: '8px',
          marginTop: '1rem',
          fontSize: '1.1rem',
          lineHeight: '1.9',
          color: '#E8E6EA',
          whiteSpace: 'pre-line',
          textAlign: 'left',
        },
        letterContainer: {
          width: '100%',
          maxWidth: '700px',
          maxHeight: '70vh',
          overflowY: 'auto',
          padding: '2rem',
          background: 'rgba(20, 20, 27, 0.6)',
          borderRadius: '12px',
          border: '1px solid rgba(139, 30, 63, 0.2)',
          backdropFilter: 'blur(10px)',
        },
        letterContent: {
          fontFamily: "'Inter', sans-serif",
        },
        letterText: {
          fontSize: '1.1rem',
          lineHeight: '2',
          color: '#E8E6EA',
          marginBottom: '1.5rem',
          textAlign: 'left',
        },
        valentineTitle: {
          fontFamily: "'Playfair Display', serif",
          color: '#C44569',
          textAlign: 'center',
        },
        particles: {
          position: 'absolute',
          top: 0,
          left: 0,
          width: '100%',
          height: '100%',
          background: 'radial-gradient(circle, rgba(196,69,105,0.1) 1px, transparent 1px)',
          backgroundSize: '50px 50px',
          opacity: 0.3,
          animation: 'breathe 12s ease-in-out infinite',
        },
      };

      return (
        <div style={styles.container}>
          <audio ref={audioRef} loop>
            <source src="song.mp3" type="audio/mpeg" />
          </audio>
          <audio ref={heartbeatRef} loop>
            <source src="heartbeat.mp3" type="audio/mpeg" />
          </audio>

          {/* Page 0: Entry */}
          {currentPage === 0 && (
            <div style={styles.page}>
              {canAdvance && (
                <>
                  <p style={{...styles.text, animation: 'fadeIn 900ms ease-out'}}>
                    You are not meant to enter here casually.
                  </p>
                  {!showInput && (
                    <button 
                      style={{...styles.button, animation: 'fadeIn 900ms ease-out 2s backwards'}}
                      onClick={() => setShowInput(true)}
                    >
                      Ask permission
                    </button>
                  )}
                  {showInput && !thinking && (
                    <div style={{animation: 'fadeUp 900ms ease-out', marginTop: '2rem'}}>
                      <p style={styles.prompt}>Who do you belong to?</p>
                      <input
                        type="text"
                        value={inputValue}
                        onChange={(e) => setInputValue(e.target.value)}
                        onKeyPress={(e) => e.key === 'Enter' && handlePasswordSubmit()}
                        style={{...styles.input, animation: showError ? 'shake 0.5s' : 'none'}}
                        autoFocus
                      />
                      {showError && <p style={styles.error}>The door stays closed.</p>}
                    </div>
                  )}
                  {thinking && (
                    <div style={{...styles.thinkingContainer, animation: 'fadeIn 900ms ease-out'}}>
                      <p style={styles.thinking}>...thinking</p>
                      <p style={{...styles.thinking, animation: 'fadeIn 900ms ease-out 3s backwards'}}>
                        Come in.
                      </p>
                    </div>
                  )}
                </>
              )}
            </div>
          )}

          {/* Page 1: Initial message */}
          {currentPage === 1 && (
            <div style={styles.page}>
              <p style={{...styles.text, animation: 'fadeIn 900ms ease-out'}}>
                You are not meant to enter here casually.
              </p>
              <button 
                style={{...styles.button, animation: 'fadeIn 900ms ease-out 1s backwards'}}
                onClick={() => setCurrentPage(2)}
              >
                Enter
              </button>
            </div>
          )}

          {/* Page 2: The Pause */}
          {currentPage === 2 && (
            <div style={styles.page}>
              <p style={{...styles.text, animation: 'fadeIn 900ms ease-out'}}>
                Don't rush.
              </p>
              <p style={{...styles.text, animation: 'fadeIn 900ms ease-out 300ms backwards'}}>
                Just stay here for a moment.
              </p>
              <div style={{...styles.progressBar, marginTop: '3rem'}}>
                <div style={{...styles.progressFill, width: `${progressTimer}%`}} />
              </div>
              {canAdvance && (
                <button 
                  style={{...styles.button, animation: 'fadeIn 900ms ease-out'}}
                  onClick={() => setCurrentPage(3)}
                >
                  Continue if you trust me
                </button>
              )}
            </div>
          )}

          {/* Page 3: 10 Things */}
          {currentPage === 3 && (
            <div style={styles.page} onClick={handleCardTap}>
              <h2 style={{...styles.heading, animation: 'fadeIn 900ms ease-out'}}>
                The 10 things I like about you
              </h2>
              <div style={styles.cardsContainer}>
                {cards.slice(0, visibleCards).map((card, i) => (
                  <div 
                    key={i}
                    style={{
                      ...styles.card,
                      animation: 'fadeUp 900ms ease-out'
                    }}
                  >
                    {card}
                  </div>
                ))}
              </div>
              {visibleCards === 10 && (
                <button 
                  style={{...styles.button, animation: 'glowPulse 2s ease-in-out infinite'}}
                  onClick={(e) => {
                    e.stopPropagation();
                    setCurrentPage(4);
                  }}
                >
                  Come closer
                </button>
              )}
            </div>
          )}

          {/* Page 4: Claim */}
          {currentPage === 4 && (
            <div style={{...styles.page, backgroundColor: '#08080C'}}>
              {visibleLines >= 1 && (
                <p style={{...styles.text, animation: 'fadeIn 900ms ease-out'}}>

              )}

              )}
              {visibleLines >= 3 && (

              )}
              {canAdvance && (

                  style={{...styles.button, animation: 'fadeIn 900ms ease-out'}}
                  onClick={() => setCurrentPage(5)}
                >
                  Keep reading
                </button>

            </div>

          {/* Page 5: Private Section */}

            <div style={styles.page}>
              {visibleLines >= 1 && (
                <p style={{...styles.text, animation: 'fadeIn 900ms ease-out'}}>

                </p>

              <div style={styles.particles} />
              <h1 style={{
                ...styles.valentineTitle,
                fontFamily: "'Great Vibes', cursive",
                fontSize: '3.5rem',
                animation: 'fadeIn 1200ms ease-out'
              }}>
                Happy Valentine's Day, K ❤️
              </h1>
              <p style={{...styles.text, animation: 'fadeIn 900ms ease-out 1s backwards', marginTop: '3rem'}}>
                You're not here because I control you
              </p>
              <p style={{...styles.text, animation: 'fadeIn 900ms ease-out 1.3s backwards'}}>
                You're here because you trust me
              </p>
              <button 
                style={{...styles.button, animation: 'fadeIn 900ms ease-out 2s backwards', marginTop: '3rem'}}
                onClick={() => setCurrentPage(9)}
              >
                Continue
              </button>
            </div>
          )}

          {/* Final Page */}
          {currentPage === 9 && (
            <div style={styles.page}>
              <h1 style={{
                ...styles.valentineTitle,
                fontSize: '4rem',
                animation: 'fadeIn 1500ms ease-out, breathe 8s ease-in-out infinite'
              }}>
                Stay.
              </h1>
            </div>
          )}
        </div>
      );
    };

    ReactDOM.render(<ValentineStory />, document.getElementById('root'));
  </script>
</body>
</html>
