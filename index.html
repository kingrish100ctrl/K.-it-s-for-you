<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>For K</title>
    
    <!-- Fonts: Playfair (Headers), Lato (Body), Pinyon Script (Elegant) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400&family=Pinyon+Script&family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">

    <style>
        /* -----------------------------------------------------------
           DESIGN SYSTEM: ROYAL CRIMSON & OBSIDIAN
        ----------------------------------------------------------- */
        :root {
            /* Palette */
            --bg-deep: #050505;       /* Almost pure black */
            --bg-card: #0F0F0F;       /* Very subtle lift */
            --accent-main: #7D1226;   /* Deep Blood Red / Crimson */
            --accent-gold: #BFA15F;   /* Muted Antique Gold */
            --text-main: #Eaeaea;     /* Off-white for readability */
            --text-dim: #888888;      /* Grey for secondary text */
            
            /* Typography */
            --font-head: 'Playfair Display', serif;
            --font-body: 'Lato', sans-serif;
            --font-script: 'Pinyon Script', cursive;

            /* Transitions */
            --ease-slow: cubic-bezier(0.4, 0.0, 0.2, 1);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: var(--font-body);
            overflow: hidden; /* App feel */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* -----------------------------------------------------------
           CORE ANIMATIONS
        ----------------------------------------------------------- */
        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(10px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-4px); }
            20%, 40%, 60%, 80% { transform: translateX(4px); }
        }

        .reveal {
            opacity: 0;
            animation: fadeIn 1.2s var(--ease-slow) forwards;
        }

        .delay-1 { animation-delay: 0.5s; }
        .delay-2 { animation-delay: 1.0s; }
        .delay-3 { animation-delay: 1.5s; }

        /* -----------------------------------------------------------
           LAYOUT COMPONENTS
        ----------------------------------------------------------- */
        #app {
            width: 100%;
            max-width: 700px;
            height: 100%;
            position: relative;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        h1, h2 {
            font-family: var(--font-head);
            font-weight: 400;
            letter-spacing: 0.05em;
            margin-bottom: 1.5rem;
            color: var(--text-main);
        }

        p {
            font-size: 1.1rem;
            line-height: 1.6;
            color: var(--text-dim);
            margin-bottom: 1.5rem;
        }

        .hidden { display: none !important; }

        /* Buttons */
        button {
            background: transparent;
            border: 1px solid var(--accent-gold);
            color: var(--accent-gold);
            padding: 12px 30px;
            font-family: var(--font-head);
            font-size: 0.95rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.5s ease;
            margin-top: 2rem;
            opacity: 0; /* Hidden initially, requires .reveal class */
        }

        button:hover, button:active {
            background: var(--accent-gold);
            color: var(--bg-deep);
            box-shadow: 0 0 15px rgba(191, 161, 95, 0.3);
        }

        /* Inputs */
        input {
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--text-dim);
            color: var(--text-main);
            font-family: var(--font-head);
            font-size: 1.4rem;
            padding: 10px;
            text-align: center;
            width: 100%;
            max-width: 280px;
            outline: none;
            margin-bottom: 2rem;
        }
        input:focus { border-bottom-color: var(--accent-main); }
        .error { border-bottom-color: var(--accent-main); animation: shake 0.4s ease; }

        /* -----------------------------------------------------------
           PAGE SPECIFIC STYLES
        ----------------------------------------------------------- */
        
        /* Page 2: Progress */
        .progress-track {
            width: 100%; max-width: 200px; height: 1px; background: #333; margin: 2rem auto; position: relative;
        }
        .progress-fill {
            position: absolute; left: 0; top: 0; height: 100%; width: 0%; background: var(--accent-main);
            transition: width 2s ease-in-out;
        }

        /* Page 3: Cards */
        .card-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 60vh;
            overflow-y: auto;
            padding-bottom: 20px;
            /* Hide scrollbar */
            scrollbar-width: none; 
            -ms-overflow-style: none;
        }
        .card-container::-webkit-scrollbar { display: none; }

        .card-item {
            background: var(--bg-card);
            border-left: 2px solid var(--accent-main);
            padding: 1rem;
            text-align: left;
            font-size: 1rem;
            color: var(--text-main);
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.5s ease;
            display: none;
        }
        .card-item.visible { display: block; opacity: 1; transform: translateY(0); }

        /* Page 6: Envelopes */
        .env-wrapper { display: flex; flex-direction: column; gap: 15px; width: 100%; }
        .env {
            border: 1px solid #333;
            padding: 1.5rem;
            cursor: pointer;
            transition: border-color 0.3s;
            background: var(--bg-card);
        }
        .env:hover { border-color: var(--accent-main); }
        .env.open {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-deep);
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            border: 1px solid var(--accent-main);
            padding: 2rem;
        }
        .env-body { display: none; margin-top: 1rem; text-align: left; line-height: 1.8; }
        .env.open .env-body { display: block; animation: fadeIn 0.8s; }
        .env-icon { font-size: 1.5rem; display: block; margin-bottom: 0.5rem; color: var(--accent-gold); }
        .env.open .env-icon { display: none; }

        /* Page 7: Letter */
        .letter-box {
            width: 100%;
            height: 65vh;
            overflow-y: scroll;
            background: var(--bg-card);
            padding: 2rem;
            text-align: left;
            border-top: 1px solid var(--accent-main);
            border-bottom: 1px solid var(--accent-main);
            scrollbar-width: none;
        }
        .letter-box::-webkit-scrollbar { display: none; }
        .sig { 
            font-family: var(--font-script); 
            font-size: 2rem; 
            color: var(--accent-main); 
            text-align: right; 
            margin-top: 2rem; 
        }

        /* Page 8: Valentine */
        .val-title {
            font-family: var(--font-script); 
            font-size: 3.5rem;
            color: var(--accent-main);
            line-height: 1.2;
            margin-bottom: 2rem;
        }

    </style>
</head>
<body>

    <!-- Audio needs to be in the same folder as song.mp3 -->
    <audio id="bg-music" loop>
        <source src="song.mp3" type="audio/mpeg">
    </audio>

    <div id="app">
        <!-- Content injected via JS -->
    </div>

    <script>
        /* -----------------------------------------------------------
           CONTENT DATA
        ----------------------------------------------------------- */
        const PASSWORDS = ['rishi', 'flash', 'flash133566'];
        
        const TEXT_CARDS = [
            "Your soft, adorable voice… it lingers even after you stop speaking",
            "The way your body quietly reacts when I guide you 🙇‍♀️",
            "Your sweetness in obeying even the smallest requests 😚",
            "You feel like a breath of fresh air in a noisy world 🍃",
            "You make me laugh 😂",
            "The warmth and softness of Your boobies 😋... impossible to ignore 🤍",
            "Your constant need for closeness and cuddles 🫂💗",
            "Your first asshole fuck story 😅",
            "How easy it is to talk to you… I could stay there forever ✨",
            "Your surrender… every “yes, sir” carries trust, and I feel it 🖤"
        ];

        const CLAIM_LINES = [
            "You don’t lose control.",
            "You place it in my hands.",
            "And I never drop it."
        ];

        const ENV_CONTENT = [
            {
                title: "I",
                text: "You spend so much time holding yourself together.<br>Choosing the right words… reacting the right way… pretending you’re more composed than you really feel.<br><br>You don’t need that here.<br>Here you can slow down, breathe, and let me hold the moment for you.<br>I’m not going anywhere."
            },
            {
                title: "II",
                text: "Look at you… following every line properly.<br>Such a well behaved girl.<br>Makes me wonder how long that innocence lasts when I start pushing a little more."
            },
            {
                title: "III",
                text: "Imagine this, my obedient submissive slut. You've been waiting just as I commanded, on your hands and knees in the entryway of your home, heart pounding with anticipation. The door clicks open, and there you are, my sweet girl, positioned perfectly for your Master. Your eyes lift slowly to meet mine, locking in that intense gaze for a lingering moment, full of devotion and desire. Then, as a good sub should, you lower them submissively, casting your lashes down to the floor, exposing the curve of your neck like an offering.<br><br>My very first words are \"Look at you, my little slut, so eager and ready for Master\" and then..........."
            }
        ];

        /* -----------------------------------------------------------
           STATE ENGINE
        ----------------------------------------------------------- */
        const app = document.getElementById('app');
        const audio = document.getElementById('bg-music');
        
        let state = {
            page: parseInt(localStorage.getItem('crimson_page')) || 1,
            musicActive: false
        };

        // Safety reset if state is corrupted
        if(state.page > 8 || state.page < 1) state.page = 1;

        function savePage(n) {
            state.page = n;
            localStorage.setItem('crimson_page', n);
        }

        // Music Logic
        function initAudio() {
            if(!state.musicActive) {
                audio.volume = 0.3;
                audio.play().catch(() => console.log("User interaction needed for audio"));
                state.musicActive = true;
            }
        }

        function fadeMusicUp() {
            let vol = audio.volume;
            let interval = setInterval(() => {
                if(vol < 0.45) {
                    vol += 0.01;
                    audio.volume = vol;
                } else {
                    clearInterval(interval);
                }
            }, 100);
        }

        /* -----------------------------------------------------------
           RENDERER
        ----------------------------------------------------------- */
        function render() {
            app.innerHTML = '';
            
            // Global click to ensure audio starts on iOS/Android
            if(!state.musicActive && state.page > 1) initAudio();

            switch(state.page) {
                case 1: page1(); break;
                case 2: page2(); break;
                case 3: page3(); break;
                case 4: page4(); break;
                case 5: page5(); break;
                case 6: page6(); break;
                case 7: page7(); break;
                case 8: page8(); break;
            }
        }

        /* --- PAGE 1: ENTRY --- */
        function page1() {
            app.innerHTML = `
                <div id="p1-wrap" style="transition: opacity 1s;">
                    <p class="reveal">You are not meant to enter here casually.</p>
                    <button id="btn-perm" class="reveal delay-2">Ask permission</button>
                    <div id="input-zone" class="hidden" style="margin-top:2rem;">
                        <p class="reveal">Who do you belong to?</p>
                        <input type="text" id="pass" autocomplete="off">
                        <br>
                        <button id="btn-enter" class="reveal">Enter</button>
                    </div>
                </div>
            `;

            document.getElementById('btn-perm').onclick = (e) => {
                initAudio();
                e.target.style.display = 'none';
                const zone = document.getElementById('input-zone');
                zone.classList.remove('hidden');
            };

            document.getElementById('btn-enter').onclick = () => {
                const val = document.getElementById('pass').value.trim().toLowerCase();
                if(PASSWORDS.includes(val)) {
                    document.getElementById('p1-wrap').style.opacity = 0.3;
                    setTimeout(() => {
                        app.innerHTML = `<h2 class="reveal">...thinking</h2>`;
                        setTimeout(() => {
                            app.innerHTML = `<h1 class="reveal">Come in.</h1>`;
                            setTimeout(() => { savePage(2); render(); }, 2000);
                        }, 2000);
                    }, 500);
                } else {
                    document.getElementById('pass').classList.add('error');
                    document.getElementById('btn-enter').innerText = "The door stays closed.";
                    setTimeout(() => {
                        document.getElementById('pass').classList.remove('error');
                        document.getElementById('btn-enter').innerText = "Enter";
                    }, 2000);
                }
            };
        }

        /* --- PAGE 2: WELCOME --- */
        function page2() {
            app.innerHTML = `
                <h1 class="reveal">Welcome</h1>
                <p class="reveal delay-1">Is my slut ready?</p>
                <div class="progress-track reveal delay-1">
                    <div id="bar" class="progress-fill"></div>
                </div>
                <button id="p2-btn" class="hidden">Continue if you trust me</button>
            `;

            setTimeout(() => document.getElementById('bar').style.width = "100%", 800);
            setTimeout(() => {
                const btn = document.getElementById('p2-btn');
                btn.classList.remove('hidden');
                btn.classList.add('reveal');
                btn.onclick = () => { savePage(3); render(); };
            }, 3000);
        }

        /* --- PAGE 3: 10 THINGS (FIXED) --- */
        function page3() {
            app.innerHTML = `
                <h2 class="reveal">The 10 things I like about you</h2>
                <div id="card-list" class="card-container"></div>
                <p id="hint" style="font-size:0.8rem; margin-top:1rem; opacity:0.5;">(Tap to reveal)</p>
                <button id="p3-btn" class="hidden">Come closer</button>
            `;

            const list = document.getElementById('card-list');
            let index = 0;

            function revealCard() {
                if(index < TEXT_CARDS.length) {
                    const el = document.createElement('div');
                    el.className = 'card-item visible';
                    el.innerText = TEXT_CARDS[index];
                    list.appendChild(el);
                    el.scrollIntoView({behavior:'smooth', block:'end'});
                    index++;

                    if(index === TEXT_CARDS.length) {
                        document.getElementById('hint').style.display = 'none';
                        setTimeout(() => {
                            const btn = document.getElementById('p3-btn');
                            btn.classList.remove('hidden');
                            btn.classList.add('reveal'); 
                            btn.style.opacity = '1'; 
                            btn.onclick = () => {
                                document.body.removeEventListener('click', revealCard);
                                savePage(4);
                                render();
                            };
                        }, 500);
                    }
                }
            }

            // Small delay before enabling click to prevent accidental triggers
            setTimeout(() => {
                document.body.addEventListener('click', (e) => {
                    if(e.target.id !== 'p3-btn') revealCard();
                });
            }, 500);
        }

        /* --- PAGE 4: CLAIM --- */
        function page4() {
            app.innerHTML = `
                <div id="lines-zone"></div>
                <button id="p4-btn" class="hidden">Keep reading</button>
            `;

            let i = 0;
            const zone = document.getElementById('lines-zone');
            
            function nextLine() {
                if(i < CLAIM_LINES.length) {
                    const p = document.createElement('h2');
                    p.className = 'reveal';
                    p.innerText = CLAIM_LINES[i];
                    zone.appendChild(p);
                    i++;
                    setTimeout(nextLine, 2500);
                } else {
                    const btn = document.getElementById('p4-btn');
                    btn.classList.remove('hidden');
                    btn.classList.add('reveal');
                    btn.style.opacity = 1;
                    btn.onclick = () => { savePage(5); render(); };
                }
            }
            nextLine();
        }

        /* --- PAGE 5: OBEDIENCE --- */
        function page5() {
            app.innerHTML = `<div id="q-box"></div>`;
            const box = document.getElementById('q-box');
            
            const steps = [
                { t: "Are you my personal property, right?", wait: 5000 },
                { t: "Are you going to obey me at all cost, right?", wait: 4000 },
                { t: "At your knees.", wait: 3000 },
                { t: "Good girl.", wait: 1500 }
            ];

            let i = 0;
            function run() {
                if(i < steps.length) {
                    box.innerHTML = `<h2 class="reveal">${steps[i].t}</h2>`;
                    setTimeout(() => {
                        i++;
                        run();
                    }, steps[i].wait);
                } else {
                    app.innerHTML = `
                        <h2 class="reveal">Good girl.</h2>
                        <button id="p5-btn" class="reveal">Ready for a read?</button>
                    `;
                    document.getElementById('p5-btn').onclick = () => { savePage(6); render(); };
                }
            }
            run();
        }

        /* --- PAGE 6: ENVELOPES --- */
        function page6() {
            app.innerHTML = `
                <div class="env-wrapper" id="envs"></div>
                <button id="p6-btn" class="hidden">Stay with me</button>
            `;

            const wrapper = document.getElementById('envs');
            let opened = new Set();

            ENV_CONTENT.forEach((c, idx) => {
                const el = document.createElement('div');
                el.className = 'env reveal';
                el.style.animationDelay = (idx * 0.2) + 's';
                el.innerHTML = `
                    <span class="env-icon">✦</span>
                    <div style="font-family:var(--font-head)">OPEN ENVELOPE ${c.title}</div>
                    <div class="env-body">
                        ${c.text}
                        <div style="text-align:center; margin-top:2rem;">
                            <span style="font-size:0.8rem; border-bottom:1px solid #555;">CLOSE</span>
                        </div>
                    </div>
                `;
                
                el.onclick = function() {
                    if(!this.classList.contains('open')) {
                        this.classList.add('open');
                        opened.add(idx);
                        if(opened.size === 3) {
                            const btn = document.getElementById('p6-btn');
                            btn.classList.remove('hidden');
                            btn.classList.add('reveal');
                            btn.style.opacity = 1;
                        }
                    } else {
                        this.classList.remove('open');
                    }
                };
                wrapper.appendChild(el);
            });

            document.getElementById('p6-btn').onclick = () => {
                fadeMusicUp();
                savePage(7);
                render();
            };
        }

        /* --- PAGE 7: LETTER (UPDATED CONTENT) --- */
        function page7() {
            app.innerHTML = `
                <div class="letter-box reveal">
                    <p>We just met yesterday, and I am already creating this site for you… I would not have given this amount of effort to anyone else.</p>
                    <p>But you… you are special, K.</p>
                    <p>I am having an infatuation with you. You are a comfort for me that helps me escape the roughness of my life. You are the kind of girl men would go to war for.</p>
                    <p>You are magical, a combination of beauty and the beast. You made me feel complete and filled a gap that existed in my life.</p>
                    <p>You are a valuable person to me. Although it’s too early to say this, I don’t believe in hiding my emotions from myself. I have met many people, and even if they leave, it’s completely fine… but that’s not the case with you. You are mine.</p>
                    <p>You are my property. Although I am not a possessive type of guy, I am still very possessive about you, and I am not going to let you go.</p>
                    <p>You have a neck leash, and I am not going to free you from it… I will make this leash so addictive for you that you won’t feel in control without it.</p>
                    <p>I guess that’s it, sweetheart.</p>
                    <div class="sig">~ R or Flash (whatever you like)</div>
                    <br>
                </div>
                <button id="p7-btn" class="reveal delay-2">Continue</button>
            `;
            document.getElementById('p7-btn').onclick = () => { savePage(8); render(); };
        }

        /* --- PAGE 8: VALENTINE (END) --- */
        function page8() {
            app.innerHTML = `
                <div class="val-title reveal">Happy Valentine’s Day, K ❤️</div>
                <p class="reveal delay-1">You’re not here because I control you.</p>
                <p class="reveal delay-2">You’re here because you trust me.</p>
            `;
        }

        // Init
        window.onload = render;

    </script>
</body>
</html>
